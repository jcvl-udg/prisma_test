type AdminBookingDetails {
  cancelledAt: DateTime
  confirmedAt: DateTime
  createdAt: DateTime!
  currency: String!
  events: [AdminBookingEvent!]!
  expiresAt: DateTime
  guestEmail: String!
  guestName: String!
  guestPhone: String
  id: ID!
  items: [AdminBookingItem!]!
  reference: String!
  status: String!
  totalAmount: String!
}

type AdminBookingEvent {
  createdAt: DateTime!
  id: ID!
  payload: String
  type: String!
}

type AdminBookingHotel {
  categoryStars: Int!
  id: ID!
  slug: String!
  title: String!
}

type AdminBookingItem {
  adults: Int!
  checkIn: Date!
  checkOut: Date!
  childrenAges: [Int!]!
  currency: String!
  hotel: AdminBookingHotel!
  id: ID!
  priceAmount: String!
  provider: AdminBookingProvider!
  providerBookingRef: String
  room: AdminBookingRoom!
  status: String!
}

type AdminBookingMetrics {
  cancelledBookings: Int!
  confirmedBookings: Int!
  confirmedTotals: [AdminCurrencyMetric!]!
  expiredBookings: Int!
  failedBookings: Int!
  pendingBookings: Int!
  totalBookings: Int!
}

type AdminBookingProvider {
  code: String!
  name: String!
}

type AdminBookingRoom {
  id: ID!
  name: String!
}

enum AdminBookingSort {
  CREATED_ASC
  CREATED_DESC
  TOTAL_ASC
  TOTAL_DESC
}

enum AdminBookingStatus {
  CANCELLED
  CONFIRMED
  EXPIRED
  FAILED
  PENDING
}

enum AdminBookingTransition {
  CANCEL
  CONFIRM
}

type AdminCurrencyMetric {
  amount: String!
  currency: String!
}

enum AdminHotelSort {
  NEWEST
  TITLE_ASC
  TITLE_DESC
}

enum AdminHotelStatus {
  ACTIVE
  DRAFT
  INACTIVE
}

type Amenity {
  category: String!
  code: String!
  id: ID!
  name: String!
}

type Booking {
  createdAt: DateTime!
  currency: String!
  expiresAt: DateTime
  id: ID!
  items: [BookingItem!]!
  reference: String!
  status: String!
  totalAmount: String!
}

type BookingItem {
  adults: Int!
  checkIn: Date!
  checkOut: Date!
  childrenAges: [Int!]!
  currency: String!
  hotel: Hotel!
  id: ID!
  priceAmount: String!
  room: Room!
  status: String!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Destination {
  code: String
  countryCode: String!
  description: String
  id: ID!
  imageUrl: String
  isFeatured: Boolean!
  latitude: Float
  longitude: Float
  name: String!
  popularityScore: Int!
  slug: String!
  themes: [String!]!
}

type DestinationSuggestion {
  code: String
  countryCode: String!
  id: ID!
  name: String!
  slug: String!
}

type Hotel {
  address: String
  amenities: [HotelAmenity!]!
  categoryStars: Int!
  description: String
  destination: Destination!
  id: ID!
  images: [HotelImage!]!
  latitude: Float
  longitude: Float
  mainImageUrl: String
  popularityScore: Int!
  priceCurrency: String!
  priceFrom: String
  propertyType: String!
  ratingAvg: Float
  reviewCount: Int!
  rooms: [Room!]!
  slug: String!
  status: String!
  themes: [String!]!
  title: String!
}

type HotelAmenity {
  amenity: Amenity!
}

type HotelFacetValue {
  count: Int!
  value: String!
}

type HotelFacets {
  amenities: [HotelFacetValue!]!
  boardTypes: [HotelFacetValue!]!
  cancellationTypes: [HotelFacetValue!]!
  priceBuckets: [HotelFacetValue!]!
  propertyTypes: [HotelFacetValue!]!
  stars: [HotelFacetValue!]!
  themes: [HotelFacetValue!]!
  total: Int!
}

input HotelFilter {
  """Por defecto 2 (solo aplica con fechas)"""
  adults: Int

  """Códigos; el hotel debe tener TODAS (POOL, SPA...)"""
  amenities: [String!]

  """Planes de alimentos"""
  boardTypes: [String!]

  """Políticas de cancelación"""
  cancellationTypes: [String!]
  checkIn: Date
  checkOut: Date

  """Por defecto 0 (solo aplica con fechas)"""
  children: Int
  destinationId: String

  """Precio "desde" por noche, máximo"""
  maxPrice: Float
  maxStars: Int

  """Precio "desde" por noche, mínimo"""
  minPrice: Float

  """Calificación mínima (0-10)"""
  minRating: Float
  minStars: Int

  """Tipos de alojamiento"""
  propertyTypes: [String!]

  """Texto libre: hotel, destino o código"""
  query: String

  """Cualquiera de estos temas (beach, family...)"""
  themes: [String!]
}

type HotelImage {
  alt: String
  id: ID!
  position: Int!
  url: String!
}

enum HotelSort {
  POPULAR
  PRICE_ASC
  PRICE_DESC
  RATING
  STARS
}

enum HotelStatus {
  ACTIVE
  DRAFT
  INACTIVE
}

type HotelSuggestion {
  categoryStars: Int!
  destinationName: String!
  id: ID!
  slug: String!
  title: String!
}

type Mutation {
  adminUpdateHotel(categoryStars: Int, description: String, id: String!, status: HotelStatus, title: String): Hotel!
  createBooking(guestEmail: String!, guestName: String!, guestPhone: String, idempotencyKey: String!, quoteId: String!): Booking!
  createManualHotel(
    categoryStars: Int!

    """ISO 3166-1 alpha-2, ej. MX"""
    countryCode: String!
    destinationCode: String
    destinationName: String!
    title: String!
  ): Hotel!
  createQuote(adults: Int!, checkIn: Date!, checkOut: Date!, childrenAges: [Int!]!, hotelId: String!, roomId: String!): Quote!
  signupUser(email: String!, name: String, password: String!): User!
  transitionAdminBooking(id: String!, reason: String, transition: AdminBookingTransition!): AdminBookingDetails!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Profile {
  bio: String
  country: String
  currency: String!
  id: ID!
  locale: String!
  phone: String
}

type Query {
  adminBookingById(id: String!): AdminBookingDetails
  adminBookingMetrics(fromDate: Date, toDate: Date): AdminBookingMetrics!
  adminBookings(after: String, before: String, first: Int, fromDate: Date, guestEmail: String, last: Int, providerCode: String, sort: AdminBookingSort = CREATED_DESC, status: AdminBookingStatus, toDate: Date): QueryAdminBookingsConnection!
  adminHotels(after: String, before: String, first: Int, last: Int, query: String, sort: AdminHotelSort = TITLE_ASC, status: AdminHotelStatus): QueryAdminHotelsConnection!
  amenities: [Amenity!]!
  destinationBySlug(slug: String!): Destination
  destinations(featuredOnly: Boolean = false, take: Int = 12): [Destination!]!
  hotelBySlug(checkIn: Date, checkOut: Date, slug: String!): Hotel
  hotelFacets(filter: HotelFilter): HotelFacets!
  hotels(after: String, before: String, filter: HotelFilter, first: Int, last: Int, sort: HotelSort = POPULAR): QueryHotelsConnection!
  hotelsCount(filter: HotelFilter): Int!
  me: User
  myBookings(first: Int = 20, skip: Int = 0): [Booking!]!
  searchHotels(checkIn: Date, checkOut: Date, destinationId: String, minStars: Int, query: String, skip: Int = 0, take: Int = 10): [Hotel!]! @deprecated(reason: "Usa hotels(filter, sort, first, after) y suggestions(query)")
  suggestions(query: String!, take: Int = 5): Suggestions!
}

type QueryAdminBookingsConnection {
  edges: [QueryAdminBookingsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryAdminBookingsConnectionEdge {
  cursor: String!
  node: Booking!
}

type QueryAdminHotelsConnection {
  edges: [QueryAdminHotelsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryAdminHotelsConnectionEdge {
  cursor: String!
  node: Hotel!
}

type QueryHotelsConnection {
  edges: [QueryHotelsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryHotelsConnectionEdge {
  cursor: String!
  node: Hotel!
}

type Quote {
  adults: Int!
  checkIn: Date!
  checkOut: Date!
  childrenAges: [Int!]!
  createdAt: DateTime!
  currency: String!
  expiresAt: DateTime!
  hotel: Hotel!
  hotelId: ID!
  id: ID!
  priceAmount: String!
  providerRateKey: String
  room: Room!
  roomId: ID!
}

type Room {
  bedType: String
  code: String
  id: ID!
  maxAdults: Int!
  maxChildren: Int!
  name: String!
  sizeM2: Int
}

type Suggestions {
  destinations: [DestinationSuggestion!]!
  hotels: [HotelSuggestion!]!
}

type User {
  email: String!
  id: ID!
  image: String
  name: String
  profile: Profile
  role: String!
}