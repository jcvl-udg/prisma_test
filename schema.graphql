type Amenity {
  category: String!
  code: String!
  id: ID!
  name: String!
}

type Booking {
  createdAt: DateTime!
  currency: String!
  expiresAt: DateTime
  id: ID!
  items: [BookingItem!]!
  reference: String!
  status: String!
  totalAmount: String!
}

type BookingItem {
  adults: Int!
  checkIn: Date!
  checkOut: Date!
  childrenAges: [Int!]!
  currency: String!
  hotel: Hotel!
  id: ID!
  priceAmount: String!
  room: Room!
  status: String!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Destination {
  code: String
  countryCode: String!
  description: String
  id: ID!
  imageUrl: String
  isFeatured: Boolean!
  latitude: Float
  longitude: Float
  name: String!
  popularityScore: Int!
  slug: String!
  themes: [String!]!
}

type DestinationSuggestion {
  code: String
  countryCode: String!
  id: ID!
  name: String!
  slug: String!
}

type Hotel {
  address: String
  amenities: [HotelAmenity!]!
  categoryStars: Int!
  description: String
  destination: Destination!
  id: ID!
  images: [HotelImage!]!
  latitude: Float
  longitude: Float
  mainImageUrl: String
  popularityScore: Int!
  priceCurrency: String!
  priceFrom: String
  ratingAvg: Float
  reviewCount: Int!
  rooms: [Room!]!
  slug: String!
  themes: [String!]!
  title: String!
}

type HotelAmenity {
  amenity: Amenity!
}

input HotelFilter {
  """Por defecto 2 (solo aplica con fechas)"""
  adults: Int

  """Códigos; el hotel debe tener TODAS (POOL, SPA...)"""
  amenities: [String!]
  checkIn: Date
  checkOut: Date

  """Por defecto 0 (solo aplica con fechas)"""
  children: Int
  destinationId: String

  """Precio "desde" por noche, máximo"""
  maxPrice: Float
  maxStars: Int

  """Precio "desde" por noche, mínimo"""
  minPrice: Float

  """Calificación mínima (0-10)"""
  minRating: Float
  minStars: Int

  """Texto libre: hotel, destino o código"""
  query: String

  """Cualquiera de estos temas (beach, family...)"""
  themes: [String!]
}

type HotelImage {
  alt: String
  id: ID!
  position: Int!
  url: String!
}

enum HotelSort {
  POPULAR
  PRICE_ASC
  PRICE_DESC
  RATING
  STARS
}

type HotelSuggestion {
  categoryStars: Int!
  destinationName: String!
  id: ID!
  slug: String!
  title: String!
}

type Mutation {
  createBooking(guestEmail: String!, guestName: String!, guestPhone: String, idempotencyKey: String!, quoteId: String!): Booking!
  createManualHotel(
    categoryStars: Int!

    """ISO 3166-1 alpha-2, ej. MX"""
    countryCode: String!
    destinationCode: String
    destinationName: String!
    title: String!
  ): Hotel!
  createProfile(bio: String!, userEmail: String!): Profile!
  createQuote(adults: Int!, checkIn: Date!, checkOut: Date!, childrenAges: [Int!]!, hotelId: String!, roomId: String!): Quote!
  signupUser(email: String!, name: String): User!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Profile {
  bio: String
  country: String
  currency: String!
  id: ID!
  locale: String!
  phone: String
}

type Query {
  amenities: [Amenity!]!
  destinationBySlug(slug: String!): Destination
  destinations(featuredOnly: Boolean = false, take: Int = 12): [Destination!]!
  hotelBySlug(slug: String!): Hotel
  hotels(after: String, before: String, filter: HotelFilter, first: Int, last: Int, sort: HotelSort = POPULAR): QueryHotelsConnection!
  hotelsCount(filter: HotelFilter): Int!
  searchHotels(destinationId: String, minStars: Int, query: String, skip: Int = 0, take: Int = 10): [Hotel!]! @deprecated(reason: "Usa hotels(filter, sort, first, after) y suggestions(query)")
  suggestions(query: String!, take: Int = 5): Suggestions!
}

type QueryHotelsConnection {
  edges: [QueryHotelsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryHotelsConnectionEdge {
  cursor: String!
  node: Hotel!
}

type Quote {
  adults: Int!
  checkIn: Date!
  checkOut: Date!
  childrenAges: [Int!]!
  createdAt: DateTime!
  currency: String!
  expiresAt: DateTime!
  hotel: Hotel!
  hotelId: ID!
  id: ID!
  priceAmount: String!
  providerRateKey: String
  room: Room!
  roomId: ID!
}

type Room {
  bedType: String
  code: String
  id: ID!
  maxAdults: Int!
  maxChildren: Int!
  name: String!
  sizeM2: Int
}

type Suggestions {
  destinations: [DestinationSuggestion!]!
  hotels: [HotelSuggestion!]!
}

type User {
  email: String!
  id: ID!
  image: String
  name: String
  profile: Profile
  role: String!
}